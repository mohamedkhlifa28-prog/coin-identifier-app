<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0F0F0F"/>
    </radialGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C430"/>
      <stop offset="55%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#A87B0E"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B923"/>
      <stop offset="100%" stop-color="#C2920F"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <circle cx="512" cy="512" r="380" fill="url(#coinGrad)"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="#8A6710" stroke-width="6" opacity="0.5"/>
  <circle cx="512" cy="512" r="332" fill="url(#innerGrad)"/>
  <circle cx="512" cy="512" r="332" fill="none" stroke="#FCE38A" stroke-width="4" opacity="0.4"/>

  <!-- Dot border ring -->
  <g fill="#3A2A05" opacity="0.55">
    <circle cx="512" cy="183" r="7"/>
    <circle cx="601" cy="194" r="7"/>
    <circle cx="684" cy="227" r="7"/>
    <circle cx="755" cy="280" r="7"/>
    <circle cx="809" cy="350" r="7"/>
    <circle cx="841" cy="432" r="7"/>
    <circle cx="841" cy="592" r="7"/>
    <circle cx="809" cy="674" r="7"/>
    <circle cx="755" cy="744" r="7"/>
    <circle cx="684" cy="797" r="7"/>
    <circle cx="601" cy="830" r="7"/>
    <circle cx="512" cy="841" r="7"/>
    <circle cx="423" cy="830" r="7"/>
    <circle cx="340" cy="797" r="7"/>
    <circle cx="269" cy="744" r="7"/>
    <circle cx="215" cy="674" r="7"/>
    <circle cx="183" cy="592" r="7"/>
    <circle cx="183" cy="432" r="7"/>
    <circle cx="215" cy="350" r="7"/>
    <circle cx="269" cy="280" r="7"/>
    <circle cx="340" cy="227" r="7"/>
