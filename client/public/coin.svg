    <polygon points="512,358 612,420 412,420"/>
    <!-- entablature bar -->
    <rect x="392" y="420" width="240" height="22"/>
    <!-- columns -->
    <rect x="404" y="452" width="22" height="140"/>
    <rect x="456" y="452" width="22" height="140"/>
    <rect x="501" y="452" width="22" height="140"/>
    <rect x="546" y="452" width="22" height="140"/>
    <rect x="598" y="452" width="22" height="140"/>
    <!-- base -->
    <rect x="380" y="592" width="264" height="20"/>
    <rect x="364" y="612" width="296" height="18"/>
  </g>

  <!-- stars -->
  <g fill="#2B1F04" opacity="0.7">
    <circle cx="512" cy="270" r="6"/>
    <circle cx="442" cy="290" r="5"/>
    <circle cx="582" cy="290" r="5"/>
